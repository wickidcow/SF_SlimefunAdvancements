name: Build SlimefunAdvancements

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SlimefunAdvancements
        uses: actions/checkout@v6
      - name: Check out Slimefun Legacy
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: .deps/Slimefun-Legacy
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Publish Slimefun Legacy API locally
        working-directory: .deps/Slimefun-Legacy
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PprojectVersion=ALBION-SNAPSHOT --no-daemon
      - name: Build with Maven against Paper 26.2 and Slimefun Legacy
        run: >-
          mvn --batch-mode clean package
          -Dpaper.version=26.2.build.111-stable
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version=ALBION-SNAPSHOT
      - name: Resolve build output
        id: project
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          JAR="target/SF_SlimefunAdvancements${VERSION}.jar"
          test -s "$JAR"
          jar tf "$JAR" | grep -Fxq 'plugin.yml'
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "jar=${JAR}" >> "$GITHUB_OUTPUT"
          sha256sum "$JAR"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.project.outputs.jar }}
          archive: false
          if-no-files-found: error
      - name: Publish raw JAR to GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.project.outputs.version }}
          JAR: ${{ steps.project.outputs.jar }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${VERSION}"; fi
          TITLE="SF_SlimefunAdvancements ${VERSION}"
          NOTES_FILE=".github/release-notes/${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
            if [ -f "$NOTES_FILE" ]; then gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE"; fi
          elif [ -f "$NOTES_FILE" ]; then
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "$TITLE" --generate-notes
          fi
