name: Build SlimefunAdvancements

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        id: maven
        shell: bash
        run: |
          set +e
          mvn --batch-mode clean package 2>&1 | tee maven-build.log
          STATUS=${PIPESTATUS[0]}
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Maven build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-build-log
          path: maven-build.log
          if-no-files-found: error
          compression-level: 0

      - name: Surface Maven failure
        if: steps.maven.outputs.status != '0'
        shell: bash
        run: |
          echo "Maven failed with exit code ${{ steps.maven.outputs.status }}"
          grep -E '^\[ERROR\]' maven-build.log | tail -n 30 | while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/'%0D'}"
            line="${line//$'\n'/'%0A'}"
            echo "::error::${line}"
          done
          exit 1

      - name: Resolve build output
        id: project
        shell: bash
        run: |
          VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          JAR="target/SF_SlimefunAdvancements${VERSION}.jar"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "jar=${JAR}" >> "$GITHUB_OUTPUT"
          test -f "$JAR"
          echo "Built $JAR"

      - name: Upload versioned JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: SF_SlimefunAdvancements${{ steps.project.outputs.version }}.jar
          path: ${{ steps.project.outputs.jar }}
          if-no-files-found: error
          compression-level: 0

      - name: Publish raw JAR to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.project.outputs.version }}
          JAR: ${{ steps.project.outputs.jar }}
        run: |
          TAG="v${VERSION}"
          TITLE="SlimefunAdvancements ${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --generate-notes
          fi
