# Enable automatic update checks.
auto-update: true

# Add custom advancements to the vanilla advancements menu (experimental).
use-advancements-api: true

# Announce completed advancements in chat.
announce-advancements: true

# Add the Slimefun Advancements button to the Slimefun Guide.
add-advancements-to-guide: true

# Enable additional diagnostic logging.
debug: false

# Legacy compatibility option. This must remain false.
# Bukkit.reloadData() can unregister recipes added dynamically by Slimefun and other plugins.
# The plugin also forces this off at runtime for older existing config files.
reload-data-on-adv-remove: false
